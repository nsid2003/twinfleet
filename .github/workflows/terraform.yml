# =============================================================================
# CI/CD TwinFleet
#  - Pull Request : lint + plan staging & prod, plan posté en commentaire. JAMAIS d'apply.
#  - Merge sur main : lint -> plan staging -> [APPROBATION] -> apply staging
#                                -> plan prod -> [APPROBATION] -> apply prod
#  L'apply est toujours déclenché par un humain (Environments GitHub protégés).
# =============================================================================
name: terraform

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write        # obtenir le jeton OIDC échangé contre des identifiants AWS temporaires
  contents: read         # lire le code
  pull-requests: write   # commenter la PR avec le plan

concurrency:             # jamais deux pipelines main en parallèle (évite deux apply concurrents)
  group: terraform-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3
  TF_IN_AUTOMATION: "true"   # messages Terraform adaptés à la CI
  TF_INPUT: "false"          # Terraform ne pose jamais de question interactive

jobs:
  # ---------------------------------------------------------------------------
  # STAGE 1 — validations statiques (aucun accès AWS)
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false   # sortie brute de terraform (plus simple à exploiter)

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff terraform/   # -check : échoue si mal formaté | -diff : montre l'écart

      - name: terraform validate (staging + prod)
        run: |
          for env in staging prod; do
            terraform -chdir=terraform/environments/$env init -backend=false   # pas de state nécessaire pour valider
            terraform -chdir=terraform/environments/$env validate
          done

      - name: ansible-lint
        run: |
          pip install --quiet ansible-core ansible-lint
          ansible-lint ansible/

  # ---------------------------------------------------------------------------
  # PR uniquement — plan des deux environnements, publié en commentaire
  # ---------------------------------------------------------------------------
  plan-pr:
    if: github.event_name == 'pull_request'
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_ARN }}   # rôle LECTURE SEULE
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init
      - run: terraform plan -var-file=${{ matrix.env }}.tfvars -no-color -out=tfplan
      - run: terraform show -no-color tfplan > plan.txt
      - name: Commenter la PR avec le plan
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/' + process.env.ENV_NAME + '/plan.txt', 'utf8');
            const body = `### terraform plan — \`${process.env.ENV_NAME}\`\n<details><summary>Voir le plan</summary>\n\n\`\`\`hcl\n${plan.slice(0, 60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  # ---------------------------------------------------------------------------
  # main — STAGING
  # ---------------------------------------------------------------------------
  plan-staging:
    if: github.event_name == 'push'
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init
      - run: terraform plan -var-file=staging.tfvars -no-color -out=tfplan
      - uses: actions/upload-artifact@v4        # on conserve LE plan relu pour l'apply
        with:
          name: tfplan-staging
          path: terraform/environments/staging/tfplan
          retention-days: 1

  apply-staging:
    needs: plan-staging
    runs-on: ubuntu-latest
    environment: staging                        # <- PAUSE : attend l'approbation d'un relecteur
    defaults:
      run:
        working-directory: terraform/environments/staging
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY_ARN }}   # rôle ÉCRITURE (seulement depuis l'environnement)
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-staging
          path: terraform/environments/staging
      - run: terraform init
      - run: terraform apply -no-color tfplan  # applique EXACTEMENT le plan relu ; refusé s'il est périmé

  # ---------------------------------------------------------------------------
  # main — PROD (seulement après un apply staging réussi)
  # ---------------------------------------------------------------------------
  plan-prod:
    needs: apply-staging
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_PLAN_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: terraform init
      - run: terraform plan -var-file=prod.tfvars -no-color -out=tfplan
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: terraform/environments/prod/tfplan
          retention-days: 1

  apply-prod:
    needs: plan-prod
    runs-on: ubuntu-latest
    environment: production                     # <- PAUSE : seconde approbation, dédiée à la prod
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_APPLY_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: terraform/environments/prod
      - run: terraform init
      - run: terraform apply -no-color tfplan
